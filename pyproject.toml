[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chitra"
version = "0.1.0"
description = "Search your photos by describing them. Offline, on any folder or drive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kruthi Varanasi" }]
keywords = ["photo search", "semantic search", "clip", "siglip", "offline", "image retrieval"]
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "tqdm>=4.60",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "torch>=2.1",
    "transformers>=4.40",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chitra = "chitra.cli:main"

[tool.setuptools.packages.find]
include = ["chitra*"]

[tool.setuptools.package-data]
chitra = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
